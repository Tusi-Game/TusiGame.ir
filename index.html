<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توسی‌گیم</title>
<meta name="description" content="توسی‌گیم - بازی‌های آنلاین فارسی">
<meta name="theme-color" content="#0e0e12">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:title" content="توسی‌گیم">
<meta property="og:type" content="website">
<meta property="og:image" content="logo.png">
<style>
  @font-face {
    font-family: 'Vazirmatn';
    src: url('Vazirmatn.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #0e0e12;
    color: #e8e8ec;
    font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem;
    text-align: center;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .logo {
    width: clamp(100px, 26vmin, 180px);
    height: auto;
    display: block;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 5vmin, 2.4rem);
    font-weight: 800;
    color: #ffffff;
  }

  /* ── game card ── */
  .game-link {
    display: block;
    width: min(100%, 380px);
    color: #e8e8ec;
    text-decoration: none;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    background: #1a1a24;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .game-link:hover {
    border-color: rgba(255,255,255,0.22);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .game-link:focus-visible { outline: 2px solid #7c6aef; outline-offset: 4px; }

  .game-banner-img {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
  }

  .play-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 700;
    background: #1a1a24;
  }

  .play-label .play-icon {
    display: inline-block;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 6px 0 6px 10px;
    border-color: transparent transparent transparent #7c6aef;
    flex-shrink: 0;
  }

  /* ── footer ── */
  footer {
    display: flex;
    justify-content: center;
    padding: 0 2rem 1.5rem;
  }

  footer img {
    display: block;
    width: auto;
    max-height: 78px;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .game-link { transition: none; }
    .game-link:hover { transform: none; }
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="توسی‌گیم" width="512" height="512">
    <h1>توسی‌گیم</h1>
    <a class="game-link" href="https://bparty.tusigame.ir/">
      <img class="game-banner-img" src="bparty-banner.png?v=2" alt="اسم فامیل آنلاین" width="2400" height="1350">
      <span class="play-label"><span class="play-icon" aria-hidden="true"></span> اسم فامیل آنلاین</span>
    </a>
  </main>
  <footer>
    <a referrerpolicy="origin" target="_blank" rel="noopener" href="https://trustseal.enamad.ir/?id=7662765&Code=BT5Rqr2JrdpHl5HkEjVWq86Tm05qHHCF"><img referrerpolicy="origin" src="https://trustseal.enamad.ir/logo.aspx?id=7662765&Code=BT5Rqr2JrdpHl5HkEjVWq86Tm05qHHCF" alt="Enamad electronic trust seal" style="cursor:pointer" code="BT5Rqr2JrdpHl5HkEjVWq86Tm05qHHCF"></a>
  </footer>
</body>
</html>
